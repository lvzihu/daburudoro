<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' file:"
    />
    <title>DaburuDoro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="widget" class="widget is-collapsed" data-phase="idle">
      <section id="companion-surface" class="companion-surface" aria-label="Drag DaburuDoro">
        <div id="character-sprite" class="character-sprite" aria-hidden="true"></div>
        <img id="character" class="character" alt="Yellow companion" draggable="false" />

        <button
          id="hide-floating"
          class="floating-button hide-floating"
          type="button"
          title="Hide DaburuDoro"
          aria-label="Hide DaburuDoro"
        >
          ×
        </button>

        <button
          id="character-menu-toggle"
          class="floating-button character-menu-toggle"
          type="button"
          title="Choose companion"
          aria-label="Choose companion"
          aria-expanded="false"
          aria-controls="character-popover"
        >
          <span class="hat-stack" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i>
          </span>
        </button>

        <section
          id="character-popover"
          class="character-popover"
          aria-label="Companion settings"
          hidden
        >
          <header class="popover-header">
            <div>
              <strong>Choose companion</strong>
              <span id="character-selection-label">Selected: Yellow</span>
            </div>
            <button id="character-menu-close" class="icon-button" type="button" aria-label="Close companion settings">×</button>
          </header>

          <div id="character-options" class="character-options" role="list"></div>

          <div class="character-details">
            <strong id="character-name">Yellow</strong>
            <span id="character-activity">Playing games</span>
          </div>

          <div class="asset-row">
            <button id="choose-music" type="button">Choose music…</button>
            <button id="remove-music" class="text-button" type="button">Remove</button>
          </div>
          <p id="music-file" class="asset-status">No Break music assigned</p>

          <label class="volume-control" for="music-volume">
            <span>Music volume</span>
            <input id="music-volume" type="range" min="0" max="100" step="1" />
            <output id="music-volume-output" for="music-volume">70%</output>
          </label>

          <p id="asset-error" class="asset-error" role="alert" aria-live="polite"></p>
        </section>
      </section>

      <div id="progress-handle" class="progress-handle">
        <button
          id="progress-toggle"
          class="progress-toggle"
          type="button"
          aria-controls="panel"
          aria-expanded="false"
          title="Show timer controls"
        >
          <span class="progress-track" aria-hidden="true">
            <span id="progress-fill" class="progress-fill"></span>
          </span>
          <span id="progress-chevron" class="progress-chevron" aria-hidden="true">⌄</span>
          <span id="progress-label" class="visually-hidden">Ready</span>
        </button>
      </div>

      <section id="panel" class="panel" aria-label="Timer controls">
        <header class="status-row">
          <span id="phase">Ready</span>
          <span id="cycle">Cycle 1 / 1</span>
        </header>

        <div id="countdown" class="countdown">35:00</div>

        <div class="timer-inputs">
          <label>
            Focus
            <span class="input-with-unit">
              <input id="focus-minutes" type="number" min="1" step="1" inputmode="numeric" />
              <span>min</span>
            </span>
          </label>
          <label>
            Break
            <span class="input-with-unit">
              <input id="break-minutes" type="number" min="1" step="1" inputmode="numeric" />
              <span>min</span>
            </span>
          </label>
          <label>
            Cycles
            <span class="input-with-unit">
              <input id="cycles" type="number" min="1" step="1" inputmode="numeric" />
              <span>×</span>
            </span>
          </label>
        </div>

        <p id="validation" class="validation" role="alert" aria-live="polite"></p>

        <div class="primary-controls">
          <button id="start" type="button">Start</button>
          <button id="pause" type="button" disabled>Pause</button>
          <button id="reset" type="button" disabled>Reset</button>
          <button id="hide" class="secondary" type="button">Hide</button>
        </div>

        <footer class="panel-footer">
          <label class="sound-toggle">
            <input id="sound" type="checkbox" />
            <span>Chime</span>
          </label>
          <button id="defaults" class="text-button" type="button">Defaults</button>
          <button id="collapse" class="text-button" type="button">Collapse</button>
        </footer>
      </section>
    </main>

    <script src="../character-catalog.js"></script>
    <script src="../character-session.js"></script>
    <script src="../audio-policy.js"></script>
    <script src="../timer.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
