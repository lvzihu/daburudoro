<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>DaburuDoro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="widget">
      <div class="drag-handle" aria-label="Drag DaburuDoro">•••</div>
      <img id="character" class="character" alt="Yellow companion" draggable="false" />
      <section class="panel">
        <div class="status-row">
          <span id="phase">Ready</span>
          <span id="cycle">Cycle 1 / 1</span>
        </div>
        <div id="countdown" class="countdown">35:00</div>
        <div class="controls">
          <label>Cycles <input id="cycles" type="number" min="1" max="99" value="1" /></label>
          <button id="start" type="button">Start</button>
          <button id="pause" type="button" disabled>Pause</button>
          <button id="reset" type="button">Reset</button>
        </div>
      </section>
    </main>
    <script src="../timer.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
